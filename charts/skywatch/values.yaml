# Default values for the SkyWatch chart.
# `backend.image.tag` and `frontend.image.tag` are rewritten by CI on every push to main.
backend:
  image:
    repository: ghcr.io/bvolovat/skywatch-backend
    tag: "6a436355a35f06be8291c134b44f82f387059d02"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  config:
    GEOCODING_URL: "https://geocoding-api.open-meteo.com/v1/search"
    FORECAST_URL: "https://api.open-meteo.com/v1/forecast"
    HTTP_TIMEOUT_SECONDS: "5"
    LOG_LEVEL: "INFO"
    GUNICORN_WORKERS: "2"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
frontend:
  image:
    repository: ghcr.io/bvolovat/skywatch-frontend
    tag: "6a436355a35f06be8291c134b44f82f387059d02"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  nodePort: 30080 # the browser opens http://<worker-ip>:30080
  config:
    HTTP_TIMEOUT_SECONDS: "10"
    LOG_LEVEL: "INFO"
    GUNICORN_WORKERS: "2"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
probes:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
