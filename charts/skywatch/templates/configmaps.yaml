# One ConfigMap per service. Each key becomes an environment variable in the container (envFrom).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend
data:
  PORT: {{ .Values.backend.port | quote }}
  {{- range $key, $value := .Values.backend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend
data:
  PORT: {{ .Values.frontend.port | quote }}
  # The backend Service's in-cluster DNS name, e.g. http://skywatch-backend:8000
  BACKEND_URL: "http://{{ .Release.Name }}-backend:{{ .Values.backend.port }}"
  {{- range $key, $value := .Values.frontend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
