---
- name: Read the installed K3s version (if any)
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_server_installed
  changed_when: false
  failed_when: false

- name: Decide whether K3s needs to be installed or upgraded
  ansible.builtin.set_fact:
    k3s_server_needs_install: "{{ k3s_server_installed.rc != 0 or k3s_version not in k3s_server_installed.stdout }}"

- name: Write the K3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Install K3s server (only when missing or on a different version)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh server
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_server_needs_install | bool
  changed_when: true

- name: Apply a pending config change before continuing
  ansible.builtin.meta: flush_handlers

- name: Ensure the K3s service is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true

- name: Wait for the API server to come up
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    timeout: 120

- name: Wait for the join token to be written
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

- name: Read the join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_token_raw
  no_log: true

- name: Share the join token with the agents (in memory only, never written to the repo)
  ansible.builtin.set_fact:
    k3s_server_node_token: "{{ k3s_server_token_raw.content | b64decode | trim }}"
  no_log: true

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_server_kubeconfig_raw
  no_log: true

- name: Write a host-side kubeconfig pointing at the VM instead of 127.0.0.1
  ansible.builtin.copy:
    content: "{{ k3s_server_kubeconfig_raw.content | b64decode | replace('https://127.0.0.1:6443', k3s_server_url) }}"
    dest: "{{ k3s_local_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
