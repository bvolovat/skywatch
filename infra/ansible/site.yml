---
- name: Prepare all nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Install K3s control plane
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Join K3s workers
  hosts: k3s_agents
  become: true
  roles:
    - k3s_agent

- name: Verify the cluster from the host
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ hostvars[groups['k3s_server'][0]]['k3s_local_kubeconfig'] }}
        wait --for=condition=Ready nodes --all --timeout=180s
      changed_when: false

    - name: Show nodes
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ hostvars[groups['k3s_server'][0]]['k3s_local_kubeconfig'] }}
        get nodes -o wide
      register: nodes
      changed_when: false

    - name: Print nodes
      ansible.builtin.debug:
        msg: "{{ nodes.stdout_lines }}"
