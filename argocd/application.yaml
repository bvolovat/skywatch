# The SkyWatch app as seen by ArgoCD: deploy charts/skywatch from main, keep the cluster in sync with Git.
# Installed by Ansible (roles/argocd); after that, every change reaches the cluster through Git alone.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skywatch
  namespace: argocd
  # Deleting the Application also deletes the resources it created.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bvolovat/skywatch.git
    targetRevision: main
    path: charts/skywatch
    helm:
      releaseName: skywatch
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: skywatch
  syncPolicy:
    automated:
      prune: true # delete resources that were removed from Git
      selfHeal: true # revert manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
